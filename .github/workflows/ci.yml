name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install pytest

      - name: Validate data JSON
        run: python scripts/validate.py

      - name: Run Python tests
        run: python -m pytest -q

      - name: Python CLI smoke
        run: |
          PYTHONPATH=src python -m hapilibur check 2026-08-17
          PYTHONPATH=src python -m hapilibur check 2026-08-17 --json
          PYTHONPATH=src python -m hapilibur selang 2026-03-20 2026-03-24
          PYTHONPATH=src python -m hapilibur range 2026-03-20 2026-03-24 --csv
          PYTHONPATH=src python -m hapilibur bulan 2026 3 --csv
          PYTHONPATH=src python -m hapilibur kota
          PYTHONPATH=src python -m hapilibur --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Typecheck API + lib
        run: npm run typecheck

      - name: Generate static site
        run: npm run build:site

      - name: Assert generated files are committed
        run: git diff --exit-code -- public/index.html public/openapi.json public/sitemap.xml public/manifest.webmanifest
